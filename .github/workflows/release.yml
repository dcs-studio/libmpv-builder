name: Release

on:
  workflow_dispatch:

jobs:
  preflight:
    name: Preflight
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main'
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1

      - name: Dart pub get
        run: dart pub get -C build-scripts

      - name: Check tag does not already exist
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(dart run build-scripts/release_info.dart version)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Project version: $version"
          if gh api "repos/${{ github.repository }}/git/ref/tags/$version" --silent 2>/dev/null; then
            echo "::error::Tag '$version' already exists on ${{ github.repository }}. Bump Versions.PROJECT before releasing."
            exit 1
          fi
          echo "Tag '$version' is free."

  android:
    needs: [preflight]
    name: Build Android
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: 'r29'
          add-to-path: false

      - name: Install build tools
        run: brew install meson ninja pkg-config nasm yasm automake autoconf libtool

      - name: dart pub get
        run: dart pub get -C build-scripts

      - name: Build for arm32
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: dart run build-scripts/android/android.dart --action=build --abis=arm32

      - name: Build for arm64
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: dart run build-scripts/android/android.dart --action=build --abis=arm64

      - name: Build for x86
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: dart run build-scripts/android/android.dart --action=build --abis=x86

      - name: Build for x86_64
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: dart run build-scripts/android/android.dart --action=build --abis=x86_64

      - name: Archive artifacts
        run: dart run build-scripts/android/android.dart --action=bundle --abis=arm32,arm64,x86,x86_64

      - uses: actions/upload-artifact@v7.0.1
        with:
          path: out/artifacts/android-binaries.zip
          if-no-files-found: error
          archive: false

  apple:
    name: Build Apple (${{ matrix.link-type }})
    runs-on: self-hosted
    needs: [preflight]
    env:
      TAG: ${{ needs.preflight.outputs.version }}
    strategy:
      fail-fast: true
      matrix:
        link-type: [static, shared]
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'

      - name: Install iOS platform
        run: sudo xcodebuild -downloadPlatform iOS

      - name: Install build tools
        run: brew install meson ninja pkg-config nasm yasm automake autoconf libtool

      - name: Install Rust
        run: |
          if ! command -v rustup &> /dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Add Rust targets & install cargo-c
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin aarch64-apple-ios aarch64-apple-ios-sim
          cargo install cargo-c

      - name: dart pub get
        run: dart pub get -C build-scripts

      - name: Build macos-arm64
        run: |
          dart run build-scripts/apple/apple.dart \
            --action=build \
            --targets=macos-arm64 \
            --link-type=${{ matrix.link-type }}

      - name: Build macos-x86_64
        run: |
          dart run build-scripts/apple/apple.dart \
            --action=build \
            --targets=macos-x86_64 \
            --link-type=${{ matrix.link-type }}

      - name: Build ios-arm64
        run: |
          dart run build-scripts/apple/apple.dart \
            --action=build \
            --targets=ios-arm64 \
            --link-type=${{ matrix.link-type }}

      - name: Build iossim-arm64
        run: |
          dart run build-scripts/apple/apple.dart \
            --action=build \
            --targets=iossim-arm64 \
            --link-type=${{ matrix.link-type }}

      - name: Bundle xcframeworks
        run: |
          dart run build-scripts/apple/apple.dart \
            --action=bundle \
            --targets=macos-arm64,macos-x86_64,ios-arm64,iossim-arm64 \
            --link-type=${{ matrix.link-type }}

      - name: Create Swift package
        if: matrix.link-type == 'static'
        run: |
          dart run build-scripts/apple/apple.dart \
            --action=generate-swift-package \
            --targets=macos-arm64,macos-x86_64,ios-arm64,iossim-arm64 \
            --repo=${{ github.repository }} \
            --tag=$TAG

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: apple-${{ matrix.link-type }}
          path: |
            out/artifacts/apple-binaries-*.zip
            out/artifacts/*.xcframework.zip
            ${{ matrix.link-type == 'static' && 'out/artifacts/Package.swift' || '' }}
          if-no-files-found: error
          archive: false

  release:
    name: Publish Release
    needs: [preflight, android, apple]
    runs-on: self-hosted
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1

      - name: dart pub get
        run: dart pub get -C build-scripts

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: out/artifacts
          merge-multiple: true

      - name: Generate release notes
        run: dart run build-scripts/release_info.dart notes > release_notes.md

      - name: Commit Package.swift
        id: commit
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mv out/artifacts/Package.swift ./Package.swift
          git add -f Package.swift
          git commit -m "release: Package.swift for ${VERSION}"
          git push origin HEAD:${GITHUB_REF_NAME}
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create tag and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes-file release_notes.md \
            --target "${{ steps.commit.outputs.sha }}" \
            out/artifacts/*